name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Der Job-Name `test` und die beiden Matrix-Dimensionen (os, python-version)
  # sind an die Branch-Protection gekoppelt: die Required Checks heißen
  # `test (<os>, <python-version>)`. Umbenennen oder Matrix umbauen lässt die
  # Required Checks ins Leere zeigen – main wäre danach ungeschützt oder
  # dauerhaft blockiert.
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.13"]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.29"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies (hash-checked from uv.lock)
        run: uv sync --locked --extra dev --python ${{ matrix.python-version }}

      - name: Install Linux GUI dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libdbus-1-3 libxcb-cursor0

      # Die vier Prüf-Steps laufen bewusst unabhängig voneinander: ohne
      # `if` würde der erste rote Step alle folgenden überspringen, und ein
      # fehlgeschlagener pytest-Lauf verdeckte ruff/mypy komplett.
      # `!cancelled()` statt `always()`: abgebrochene Läufe sollen NICHT
      # weiterlaufen. Nebenwirkung, die so gewollt ist – scheitert `uv sync`,
      # werden alle vier rot statt nur einer. Das ist ehrlicher, nicht
      # schlechter.
      - name: Run pytest
        if: '!cancelled()'
        env:
          QT_QPA_PLATFORM: offscreen
          # Sprint 77 / Befund #8 – schaltet den Testmengen-Wächter in
          # tests/conftest.py scharf. Ohne die Variable ist der Hook bewusst ein
          # No-Op, sonst schlüge jeder lokale Teil-Lauf (`pytest
          # tests/ui/test_worker.py`) fehl und der Wächter würde zur Plage statt
          # zum Netz. Er greift deshalb nur dort, wo die volle Suite läuft.
          SAMPLING_TOOL_ENFORCE_TEST_FLOOR: "1"
        run: uv run pytest --cov=sampling_tool --cov-report=term

      - name: Run ruff check
        if: '!cancelled()'
        run: uv run ruff check .

      - name: Run ruff format check
        if: '!cancelled()'
        run: uv run ruff format --check .

      - name: Run mypy
        if: '!cancelled()'
        run: uv run mypy src tests

  # Eigener Job statt Step im `test`-Job: der Advisory-Stand ist eine LIVE-Quelle
  # (die Datenbank ändert sich ohne Code-Änderung), ein Treffer hat mit dem
  # Diff nichts zu tun. Als Step vor pytest hat er in Sprint 72 den kompletten
  # Ubuntu-Testlauf verschluckt – roter Check, aber kein einziges
  # Testergebnis. Als eigener Job sind beide Signale in der Checks-Liste
  # getrennt sichtbar. Bewusst KEIN continue-on-error: der Audit soll
  # weiterhin rot werden können.
  # Setup-Steps sind zum `test`-Job dupliziert statt geteilt – GitHub Actions
  # unterstützt in Workflow-Dateien keine YAML-Anchors/Aliases; die Alternative
  # wäre eine Composite-Action, was für vier Standard-Steps mehr Indirektion
  # als Nutzen brächte.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.29"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies (hash-checked from uv.lock)
        run: uv sync --locked --extra dev --python 3.13

      - name: pip-audit (dependency vulnerability scan)
        run: uv run pip-audit

  # Sprint 77 / Befund #4 – `ci.yml` läuft auf `pull_request`, `release.yml` nur
  # auf Tags. Eine PR, die `release.yml` ändert, bekam bis hier drei grüne
  # Checks, von denen KEINER eine Zeile der geänderten Datei ausführt. Die fünf
  # offenen Dependabot-PRs sind genau dieser Fall.
  #
  # actionlint schließt die Hälfte davon: Syntax, Ausdrücke, Job-/Step-Struktur
  # und – via shellcheck – die `run:`-Körper beider Dateien, auf JEDER PR.
  # Die andere Hälfte, das ENTFERNEN einer Zusage, findet ein Linter prinzipiell
  # nicht; dafür gibt es `tests/unit/test_workflow_policy.py`. Beide ergänzen
  # sich, keiner ersetzt den anderen.
  #
  # Eigener Job nach dem Muster von `audit` (Sprint 73): als Step im `test`-Job
  # verschluckte ein roter Lint den Testlauf oder umgekehrt.
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: actionlint (Workflow-Linter, inkl. shellcheck)
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          # Auch die Linter-Version ist gepinnt, nicht nur die Action (Default
          # wäre `latest`). Sonst könnte ein neues actionlint-Release die CI auf
          # unverändertem Code rot machen – dieselbe Live-Quellen-Falle, die
          # Sprint 73 beim Advisory-Stand in einen eigenen Job ausgelagert hat.
          # 1.7.12 ist die Version, gegen die die Workflows lokal geprüft wurden.
          version: "1.7.12"
