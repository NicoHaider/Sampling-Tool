name: Release Build

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  test:
    name: Test gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.29"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies (hash-checked from uv.lock)
        run: uv sync --locked --extra dev

      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libdbus-1-3 libxcb-cursor0

      - name: pip-audit (dependency vulnerability scan)
        run: uv run pip-audit

      - name: Run pytest
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run pytest -q

      - name: Run ruff check
        run: uv run ruff check .

      - name: Run ruff format check
        run: uv run ruff format --check .

      - name: Run mypy
        run: uv run mypy src tests

  build:
    name: Build ${{ matrix.os }}
    needs: [test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact_name: AuditSamplingTool-macOS.zip
          - os: windows-latest
            artifact_name: AuditSamplingTool-Windows.zip

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.29"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies (hash-checked from uv.lock)
        run: uv sync --locked --extra build

      - name: Build
        run: uv run python scripts/build_app.py

      - name: Frozen-Bundle-Smoke (macOS)
        if: matrix.os == 'macos-latest'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -e
          BIN="dist/Audit Sampling Tool.app/Contents/MacOS/AuditSamplingTool"
          "$BIN" &
          PID=$!
          sleep 10
          if kill -0 "$PID" 2>/dev/null; then
            echo "Bundle-Smoke OK: Prozess läuft nach 10s (kein Startup-/Import-Crash)."
            kill "$PID"
            wait "$PID" 2>/dev/null || true
          else
            wait "$PID"
            STATUS=$?
            echo "Bundle-Smoke FAILED: Prozess ist vorzeitig beendet (exit $STATUS)."
            exit 1
          fi
        shell: bash

      - name: Frozen-Bundle-Smoke (Windows)
        if: matrix.os == 'windows-latest'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $exe = "dist\AuditSamplingTool\AuditSamplingTool.exe"
          $proc = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 10
          if ($proc.HasExited) {
            Write-Host "Bundle-Smoke FAILED: Prozess ist vorzeitig beendet (exit $($proc.ExitCode))."
            exit 1
          } else {
            Write-Host "Bundle-Smoke OK: Prozess laeuft nach 10s (kein Startup-/Import-Crash)."
            Stop-Process -Id $proc.Id -Force
          }
        shell: pwsh

      - name: Package macOS .app
        if: matrix.os == 'macos-latest'
        run: |
          cd dist
          zip -r "../${{ matrix.artifact_name }}" "Audit Sampling Tool.app"
        shell: bash

      - name: Package Windows .exe folder
        if: matrix.os == 'windows-latest'
        run: |
          cd dist
          7z a -tzip "../${{ matrix.artifact_name }}" AuditSamplingTool
        shell: bash

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.29"

      - name: Generate CycloneDX SBOM from the lock
        run: uv export --locked --format cyclonedx1.5 --preview-features sbom-export -o sbom.cdx.json

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts

      - name: Generate SHA-256 checksums
        run: |
          cd artifacts
          sha256sum \
            AuditSamplingTool-macOS.zip/AuditSamplingTool-macOS.zip \
            AuditSamplingTool-Windows.zip/AuditSamplingTool-Windows.zip \
            | sed -E 's#^([0-9a-f]+)  .*/([^/]+)$#\1  \2#' > SHA256SUMS
          cat SHA256SUMS

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom.cdx.json
          path: sbom.cdx.json
          retention-days: 90

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            artifacts/AuditSamplingTool-macOS.zip/AuditSamplingTool-macOS.zip
            artifacts/AuditSamplingTool-Windows.zip/AuditSamplingTool-Windows.zip
            artifacts/SHA256SUMS
            sbom.cdx.json
          generate_release_notes: true
          draft: true
          prerelease: false
