name: Release Build

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  # Der Job-Name `test` bleibt exakt (Sprint-73-/74-Constraint). Die Required
  # Checks von `main` hängen zwar an `ci.yml` (`test (<os>, <python-version>)`),
  # aber beide Workflows halten bewusst dieselbe Struktur – wer den einen liest,
  # versteht den anderen.
  test:
    name: Test gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.29"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies (hash-checked from uv.lock)
        run: uv sync --locked --extra dev

      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libdbus-1-3 libxcb-cursor0

      # Wie in ci.yml (Sprint 73): die vier Prüf-Steps laufen unabhängig
      # voneinander. Ohne `if` überspringt der erste rote Step alle folgenden –
      # ein fehlgeschlagener pytest-Lauf verdeckte ruff/mypy komplett.
      # `!cancelled()` statt `always()`: abgebrochene Läufe sollen NICHT
      # weiterlaufen. Die Setup-Steps darüber bekommen es bewusst NICHT –
      # scheitert `uv sync`, sind alle vier rot statt nur einer, und das ist
      # ehrlicher als vier grüne Checks ohne installierte Umgebung.
      - name: Run pytest
        if: '!cancelled()'
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run pytest -q

      - name: Run ruff check
        if: '!cancelled()'
        run: uv run ruff check .

      - name: Run ruff format check
        if: '!cancelled()'
        run: uv run ruff format --check .

      - name: Run mypy
        if: '!cancelled()'
        run: uv run mypy src tests

  # Sprint 74 / Befund A – dieselbe Entkopplung wie in ci.yml (Sprint 73), hier
  # aber mit schärferer Konsequenz: `pip-audit` lief als Step VOR `pytest` im
  # Job `test`, an dem `build` per `needs: [test]` hängt. Ein einziges neues
  # Advisory in irgendeiner Dependency brach damit einen getaggten Release ab,
  # OHNE dass ein einziger Test gelaufen war – und die Artefakte entstanden gar
  # nicht erst. Der Advisory-Stand ist eine LIVE-Quelle (die Datenbank ändert
  # sich ohne Code-Änderung); er darf einen fertigen, grün getesteten Release
  # nicht blockieren.
  # Bewusst KEIN `continue-on-error`: der Audit soll weiterhin rot werden können
  # und als eigenes Signal in der Checks-Liste sichtbar sein.
  # Setup-Steps sind zum `test`-Job dupliziert statt geteilt – GitHub Actions
  # unterstützt in Workflow-Dateien keine YAML-Anchors/Aliases.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.29"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies (hash-checked from uv.lock)
        run: uv sync --locked --extra dev

      - name: pip-audit (dependency vulnerability scan)
        run: uv run pip-audit

  # `needs: [test]` und BEWUSST NICHT `needs: [test, audit]` – sonst wäre die
  # Maskierung nur von einem Step in eine Job-Abhängigkeit verschoben.
  build:
    name: Build ${{ matrix.os }}
    needs: [test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact_name: AuditSamplingTool-macOS.zip
          - os: windows-latest
            artifact_name: AuditSamplingTool-Windows.zip

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.29"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies (hash-checked from uv.lock)
        run: uv sync --locked --extra build

      - name: Build
        run: uv run python scripts/build_app.py

      - name: Frozen-Bundle-Smoke (macOS)
        if: matrix.os == 'macos-latest'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -e
          BIN="dist/Audit Sampling Tool.app/Contents/MacOS/AuditSamplingTool"
          "$BIN" &
          PID=$!
          sleep 10
          if kill -0 "$PID" 2>/dev/null; then
            echo "Bundle-Smoke OK: Prozess läuft nach 10s (kein Startup-/Import-Crash)."
            kill "$PID"
            wait "$PID" 2>/dev/null || true
          else
            wait "$PID"
            STATUS=$?
            echo "Bundle-Smoke FAILED: Prozess ist vorzeitig beendet (exit $STATUS)."
            exit 1
          fi
        shell: bash

      - name: Frozen-Bundle-Smoke (Windows)
        if: matrix.os == 'windows-latest'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $exe = "dist\AuditSamplingTool\AuditSamplingTool.exe"
          $proc = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 10
          if ($proc.HasExited) {
            Write-Host "Bundle-Smoke FAILED: Prozess ist vorzeitig beendet (exit $($proc.ExitCode))."
            exit 1
          } else {
            Write-Host "Bundle-Smoke OK: Prozess laeuft nach 10s (kein Startup-/Import-Crash)."
            Stop-Process -Id $proc.Id -Force
          }
        shell: pwsh

      - name: Package macOS .app
        if: matrix.os == 'macos-latest'
        run: |
          cd dist
          zip -r "../${{ matrix.artifact_name }}" "Audit Sampling Tool.app"
        shell: bash

      - name: Package Windows .exe folder
        if: matrix.os == 'windows-latest'
        run: |
          cd dist
          7z a -tzip "../${{ matrix.artifact_name }}" AuditSamplingTool
        shell: bash

      # Sprint 75 / Befund B.1 – der Weg in ein grünes, aber unvollständiges
      # Release: ohne `if-no-files-found` ist der Default `warn`. Matcht `path`
      # nichts (umbenanntes Zip, fehlgeschlagenes Packaging, geänderter
      # `artifact_name`), lädt der Step NULL Dateien hoch und bleibt GRÜN.
      # `error` ist die einzige nicht-zirkuläre Absicherung dagegen: sie macht
      # den Build-Job rot, und weil `release` per `needs: build` ALLE
      # Matrix-Legs verlangt, kommt es dann gar nicht erst zum Veröffentlichen.
      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.29"

      - name: Generate CycloneDX SBOM from the lock
        run: uv export --locked --format cyclonedx1.5 --preview-features sbom-export -o sbom.cdx.json

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts

      # Sprint 75 / Befund B.2 – `shell: bash` ist hier keine Kosmetik. Ohne den
      # Key nutzt GitHub `bash -e {0}`, also OHNE `pipefail`; `sha256sum … | sed
      # … > SHA256SUMS` nimmt dann den Exit-Code von `sed` (immer 0). Lokal
      # gemessen mit dem alten Step-Body und einer fehlenden Datei: Exit 0,
      # Step GRÜN, SHA256SUMS mit EINER statt ZWEI Zeilen. `set -euo pipefail`
      # zusätzlich als Gürtel und Hosenträger – genau diese Default-Annahme war
      # die Fehlerursache, sie darf nicht ein zweites Mal implizit bleiben.
      #
      # Der Step muss VOR dem SBOM-Upload stehen: die Erwartungsliste wird aus
      # den heruntergeladenen Artefakt-Verzeichnissen abgeleitet, und zu diesem
      # Zeitpunkt sind das genau die Build-Artefakte.
      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          export LC_ALL=C
          # `download-artifact` legt `artifacts/` NICHT an, wenn der Lauf keine
          # Artefakte hat. Ohne das `mkdir` stirbt der Step schon am `cd` mit
          # „No such file or directory" – rot, aber ohne die aussagekräftige
          # Meldung des Guards darunter.
          mkdir -p artifacts
          cd artifacts

          # Erwartungsliste = die Build-Matrix, nicht ein zweites Mal getippt
          # (§2.4): `upload-artifact` legt jedes Artefakt unter
          # `artifacts/<name>/` ab, und dessen `name:` ist die Matrix-Variable
          # artifact_name. Die Verzeichnisnamen SIND also die Matrix-Werte.
          # (Bewusst ohne Expression-Syntax geschrieben: im `release`-Job gibt es
          # keine Matrix, ein Ausdruck darauf würde zu Leerstring expandieren und
          # den Kommentar entkernen.)
          # Glob statt `find -printf`/`mapfile`: beides ist GNU- bzw. bash-4-only
          # und damit lokal nicht gegenprüfbar. Matcht `*/` nichts, bleibt es
          # das Literal und der `-d`-Test filtert es weg.
          #
          # Nur die BUILD-Artefakte, nicht „alles in artifacts/": `download-artifact`
          # ohne `name:`/`pattern:` lädt ALLE Artefakte des LAUFS. Beim Re-Run des
          # `release`-Jobs liegt `sbom.cdx.json` aus Versuch 1 schon im Lauf (v4-
          # Artefakte gehören dem Lauf, nicht dem Versuch) und stünde sonst als
          # dritte Zeile in der veröffentlichten SHA256SUMS – gemessen. Nicht
          # still übergehen, sondern protokollieren (§3: keine stummen Filter).
          for entry in */; do
            [ -d "$entry" ] || continue
            case "${entry%/}" in
              *.zip) ;;
              *) echo "Hinweis: '${entry%/}' ist kein Build-Artefakt und wird nicht geprüft." ;;
            esac
          done

          # `sort -f` (case-insensitiv) ist hier lasttragend: der Glob sortiert
          # unter LC_ALL=C das große 'W' (0x57) vor das kleine 'm' (0x6D) und
          # hätte die Zeilenfolge der veröffentlichten SHA256SUMS von
          # (macOS, Windows) auf (Windows, macOS) gekippt. Case-insensitiv bleibt
          # die Datei byte-identisch zum Vor-Sprint-75-Stand (§2.5).
          bundles=()
          while IFS= read -r name; do
            [ -n "$name" ] || continue
            bundles+=("$name")
          done < <(
            for entry in */; do
              [ -d "$entry" ] || continue
              printf '%s\n' "${entry%/}"
            done | grep -E '\.zip$' | LC_ALL=C sort -f
          )

          if [ "${#bundles[@]}" -eq 0 ]; then
            echo "::error::Keine Build-Artefakte heruntergeladen – das Release wäre leer." >&2
            exit 1
          fi

          : > SHA256SUMS
          for name in "${bundles[@]}"; do
            if [ ! -s "$name/$name" ]; then
              echo "::error::Artefakt '$name/$name' fehlt oder ist leer." >&2
              ls -la "$name" >&2 || true
              exit 1
            fi

            # `[ -s ]` prüft NUR „größer als 0 Byte". Gemessen: ein auf 40 Byte
            # abgeschnittenes Zip kommt damit durch, bekommt eine Prüfsumme und
            # überlebt sogar die `sha256sum -c`-Gegenprobe unten – die rehasht
            # dieselben Bytes und beweist deshalb Lesbarkeit, nie Integrität.
            # `unzip -t` prüft die CRCs wirklich; die Eintragszahl fängt zusätzlich
            # das gültige, aber LEERE Archiv (Packaging lief, hat nichts gepackt).
            if ! unzip -t -qq "$name/$name" >/dev/null 2>&1; then
              echo "::error::Artefakt '$name/$name' ist kein intaktes Zip (unzip -t schlägt fehl)." >&2
              exit 1
            fi
            entries=$(unzip -Z1 "$name/$name" 2>/dev/null | wc -l)
            if [ "$entries" -eq 0 ]; then
              echo "::error::Artefakt '$name/$name' ist ein leeres Zip (0 Einträge)." >&2
              exit 1
            fi
            # Aus dem Artefakt-Ordner heraus, damit die Prüfsummendatei bare
            # Basenames enthält: im Release liegen alle Assets flach nebeneinander.
            ( cd "$name" && sha256sum "$name" ) >> SHA256SUMS
          done

          # Positive Vollständigkeitsprüfung: die drei abgeschalteten Defaults
          # verhindern die BEKANNTEN Wege in eine unvollständige Prüfsummendatei,
          # diese Prüfung auch die unbekannten (0-Byte-Datei, abgeschnittenes
          # Zip, gültiges aber leeres Zip, null Artefakte, kurze/kaputte
          # SHA256SUMS) – jeder dieser Fälle lokal gegen diesen Step-Body gemessen.
          #
          # GRENZE DIESER PRÜFUNG, ehrlich benannt: fehlt ein Artefakt-Ordner
          # KOMPLETT, schrumpft die abgeleitete Erwartungsliste mit – die Prüfung
          # ist an dieser Stelle zirkulär und bleibt grün. Gemessen, nicht
          # vermutet. Diesen Fall deckt sie bewusst nicht ab, sondern:
          #   1. `if-no-files-found: error` im Build-Job – ein Leg, das nichts
          #      hochlädt, wird ROT, und `needs: build` verlangt ALLE Legs, also
          #      läuft dieser Job dann gar nicht.
          #   2. `fail_on_unmatched_files: true` am `Create Release`-Step – dessen
          #      `files:`-Liste nennt beide Zips explizit und ist damit die
          #      nicht-zirkuläre Erwartung zum Veröffentlichungszeitpunkt.
          # Die drei Fixes ergänzen sich; keiner ersetzt einen anderen.
          lines=$(wc -l < SHA256SUMS)
          if [ "$lines" -ne "${#bundles[@]}" ]; then
            echo "::error::SHA256SUMS hat $lines Zeile(n), erwartet ${#bundles[@]}." >&2
            exit 1
          fi
          for name in "${bundles[@]}"; do
            # Feldweise über Spaltenpositionen, nicht per Regex über den Namen:
            # `AuditSamplingTool-macOS.zip` als Muster würde den Punkt als
            # „beliebiges Zeichen" lesen. Keine Intervall-Ausdrücke, damit es
            # auch unter mawk läuft.
            if ! awk -v want="$name" '
              {
                hash = substr($0, 1, 64)
                sep  = substr($0, 65, 2)
                file = substr($0, 67)
              }
              hash ~ /^[0-9a-f]+$/ && length(hash) == 64 && sep == "  " && file == want { found = 1 }
              END { exit !found }
            ' SHA256SUMS; then
              echo "::error::'${name}' fehlt in SHA256SUMS oder hat kein gültiges Format." >&2
              exit 1
            fi
          done

          # Gegenprobe mit dem Werkzeug, das auch der Empfänger benutzt: erst
          # damit ist belegt, dass die veröffentlichte Datei wirklich prüfbar ist.
          verify_dir="$(mktemp -d)"
          for name in "${bundles[@]}"; do
            cp "$name/$name" "$verify_dir/"
          done
          cp SHA256SUMS "$verify_dir/"
          ( cd "$verify_dir" && sha256sum -c SHA256SUMS )
          rm -rf "$verify_dir"

          echo "SHA256SUMS vollständig (${#bundles[@]} Artefakt(e)):"
          cat SHA256SUMS

      # `overwrite: true`, weil der Default `false` diesen Job NICHT re-runnable
      # macht: beim „Re-run failed jobs" existiert das Artefakt aus Versuch 1
      # noch im Lauf und der Upload scheitert daran. Relevant, weil der
      # Publish-Pfad noch nie erfolgreich gelaufen ist – der erste echte Tag
      # braucht mit hoher Wahrscheinlichkeit genau diesen Re-Run.
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom.cdx.json
          path: sbom.cdx.json
          if-no-files-found: error
          overwrite: true
          retention-days: 90

      # Sprint 75 / Befund B.3 – `fail_on_unmatched_files` ist ohne den Key
      # `false`: ein Eintrag in `files:`, der nichts matcht, wird still
      # übersprungen und das Release entsteht trotzdem. Diese Liste ist damit
      # die dritte und letzte Stelle, an der eine fehlende Binärdatei bisher
      # lautlos verschwinden konnte.
      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            artifacts/AuditSamplingTool-macOS.zip/AuditSamplingTool-macOS.zip
            artifacts/AuditSamplingTool-Windows.zip/AuditSamplingTool-Windows.zip
            artifacts/SHA256SUMS
            sbom.cdx.json
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: true
          prerelease: false
