name: Release Build

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  test:
    name: Test gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libdbus-1-3 libxcb-cursor0

      - name: Run pytest
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

      - name: Run ruff check
        run: ruff check .

      - name: Run ruff format check
        run: ruff format --check .

      - name: Run mypy
        run: mypy src tests

  build:
    name: Build ${{ matrix.os }}
    needs: [test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact_name: AuditSamplingTool-macOS.zip
          - os: windows-latest
            artifact_name: AuditSamplingTool-Windows.zip

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[build]"

      - name: Build
        run: python scripts/build_app.py

      - name: Package macOS .app
        if: matrix.os == 'macos-latest'
        run: |
          cd dist
          zip -r "../${{ matrix.artifact_name }}" "Audit Sampling Tool.app"
        shell: bash

      - name: Package Windows .exe folder
        if: matrix.os == 'windows-latest'
        run: |
          cd dist
          7z a -tzip "../${{ matrix.artifact_name }}" AuditSamplingTool
        shell: bash

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts

      - name: Generate SHA-256 checksums
        run: |
          cd artifacts
          sha256sum \
            AuditSamplingTool-macOS.zip/AuditSamplingTool-macOS.zip \
            AuditSamplingTool-Windows.zip/AuditSamplingTool-Windows.zip \
            | sed -E 's#^([0-9a-f]+)  .*/([^/]+)$#\1  \2#' > SHA256SUMS
          cat SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            artifacts/AuditSamplingTool-macOS.zip/AuditSamplingTool-macOS.zip
            artifacts/AuditSamplingTool-Windows.zip/AuditSamplingTool-Windows.zip
            artifacts/SHA256SUMS
          generate_release_notes: true
          draft: true
          prerelease: false
